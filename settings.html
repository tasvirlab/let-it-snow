<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Let It Snow</title>
<style>
:root {
  --bg0: #1a2058; --bg1: #121640; --card: rgba(255,255,255,.055); --line: rgba(255,255,255,.09);
  --txt: #eef0ff; --mut: #9aa3d6; --acc: #6f7dff; --acc2: #a9b4ff; --warm: #ffd166;
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  font: 13px/1.45 "Segoe UI Variable Text", "Segoe UI", -apple-system, system-ui, sans-serif;
  color: var(--txt); user-select: none; overflow: hidden;
  background:
    radial-gradient(110% 55% at 15% 0%, #2f3896 0%, transparent 60%),
    radial-gradient(80% 50% at 100% 100%, #3b2066 0%, transparent 65%),
    linear-gradient(180deg, var(--bg0), var(--bg1));
}
header { height: 40px; display: flex; align-items: center; gap: 10px; padding: 0 16px; -webkit-app-region: drag; }
.mac header { padding-left: 84px; }
header img { width: 22px; height: 22px; border-radius: 6px; }
header b { font-weight: 600; letter-spacing: .2px; }
header small { color: var(--mut); margin-left: 6px; }
main { height: calc(100% - 40px); overflow-y: auto; padding: 4px 16px 18px; }
main::-webkit-scrollbar { width: 8px; } main::-webkit-scrollbar-thumb { background: rgba(255,255,255,.12); border-radius: 8px; }

.hero {
  position: relative; overflow: hidden; border-radius: 16px; padding: 18px 18px 16px;
  background: linear-gradient(135deg, #5664ff 0%, #3a2fa8 55%, #2a1f6e 100%);
  box-shadow: 0 10px 30px rgba(20,10,80,.45), inset 0 1px 0 rgba(255,255,255,.18);
  display: flex; align-items: center; gap: 14px; margin-bottom: 12px;
}
.hero h1 { font-size: 20px; font-weight: 650; letter-spacing: -.2px; }
.hero p { color: #d7dcff; opacity: .85; margin-top: 2px; }
.hero .grow { flex: 1; position: relative; z-index: 1; }
.hero .sw { position: relative; z-index: 1; }
.hero::after { /* snow cap on the card */
  content: ""; position: absolute; left: -6px; right: -6px; top: -8px; height: 16px; border-radius: 0 0 50% 50% / 0 0 100% 100%;
  background: radial-gradient(circle at 10% 100%, #fff 9px, transparent 10px) 0 0 / 34px 16px repeat-x, #fff; opacity: .95;
  filter: drop-shadow(0 2px 2px rgba(30,40,110,.35));
}
.flake { position: absolute; top: -10px; width: 4px; height: 4px; border-radius: 50%; background: #fff; opacity: .8; animation: fall linear infinite; }
@keyframes fall { to { transform: translate(var(--dx), 130px); opacity: 0; } }

.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px; margin-bottom: 12px; backdrop-filter: blur(8px); }
.ax p { color: var(--mut); white-space: pre-line; margin-bottom: 10px; }
.axb { display: flex; gap: 8px; justify-content: flex-end; }
.axb .pri { background: var(--acc); box-shadow: 0 2px 10px rgba(111,125,255,.45); }
.card h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--acc2); font-weight: 600; margin-bottom: 10px; display: flex; gap: 6px; align-items: center; }

.seg { display: flex; background: rgba(0,0,0,.22); border-radius: 10px; padding: 3px; margin-bottom: 12px; }
.seg button { flex: 1; }
button {
  font: inherit; color: var(--txt); background: transparent; border: 0; border-radius: 8px; padding: 7px 10px; cursor: pointer;
  transition: background .15s, transform .1s;
}
button:active { transform: scale(.97); }
.seg button.on { background: var(--acc); box-shadow: 0 2px 10px rgba(111,125,255,.45); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.chips button { background: rgba(255,255,255,.07); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; }
.chips button.on { background: rgba(111,125,255,.3); border-color: var(--acc); }
.chips button:hover, .acts button:hover { background: rgba(255,255,255,.12); }

.city { display: flex; gap: 6px; margin-bottom: 8px; }
.city input {
  flex: 1; font: inherit; color: var(--txt); background: rgba(0,0,0,.25); border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; outline: none; user-select: text;
}
.city input:focus { border-color: var(--acc); }
.city button { background: var(--acc); }
.live { color: var(--mut); min-height: 18px; margin-bottom: 10px; }
.live b { color: var(--txt); font-weight: 600; }
.live.err { color: #ff9aa8; }

.row { display: flex; justify-content: space-between; margin: 8px 0 2px; }
.row output { color: var(--acc2); font-variant-numeric: tabular-nums; }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 22px; background: transparent; }
input[type=range]::-webkit-slider-runnable-track {
  height: 4px; border-radius: 4px; background: linear-gradient(90deg, var(--acc) var(--p, 50%), rgba(255,255,255,.14) var(--p, 50%));
}
input[type=range].bi::-webkit-slider-runnable-track { background: rgba(255,255,255,.14); }
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance: none; width: 16px; height: 16px; margin-top: -6px; border-radius: 50%; background: #fff;
  box-shadow: 0 0 0 4px rgba(111,125,255,.35), 0 2px 6px rgba(0,0,0,.35);
}
input[type=range]:disabled { opacity: .45; }

.tg { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); cursor: pointer; }
.tg:first-of-type { border-top: 0; }
.tg small { display: block; color: var(--mut); font-size: 11.5px; }
.sw { position: relative; width: 40px; height: 22px; flex: none; }
.sw input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.sw i { position: absolute; inset: 0; border-radius: 22px; background: rgba(255,255,255,.16); transition: background .2s; pointer-events: none; }
.sw i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .2s cubic-bezier(.3,1.4,.5,1); box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.sw input:checked + i { background: var(--acc); }
.sw input:checked + i::after { transform: translateX(18px); }
.sw.big { width: 52px; height: 30px; } .sw.big i::after { width: 24px; height: 24px; }
.sw.big input:checked + i { background: #fff; } .sw.big input:checked + i::after { background: var(--acc); transform: translateX(22px); }

.acts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 10px; }
.acts button { background: rgba(255,255,255,.07); border: 1px solid var(--line); text-align: left; padding: 9px 10px; }
.acts button span { margin-right: 6px; }
.acts button b { font-weight: inherit; }
.tip { color: var(--mut); font-size: 12px; text-align: center; padding: 4px 10px 0; }
</style>
</head>
<body>
<header>
  <img src="assets/tray.png" alt="">
  <b data-t="app"></b><small id="countdown"></small>
</header>
<main>
  <section class="hero">
    <div class="grow">
      <h1 id="heroTitle"></h1>
      <p id="heroSub"></p>
    </div>
    <label class="sw big"><input type="checkbox" id="run"><i></i></label>
  </section>

  <section class="card ax" id="ax" hidden>
    <h2>❄ <span data-t="axTitle"></span></h2>
    <p data-t="axText"></p>
    <div class="axb"><button id="axNo" data-t="axLater"></button><button id="axYes" class="pri" data-t="axAllow"></button></div>
  </section>

  <section class="card">
    <h2>❄ <span data-t="weather"></span></h2>
    <div class="seg"><button data-mode="manual" data-t="manual"></button><button data-mode="real" data-t="real"></button></div>
    <div id="realBox">
      <div class="city"><input id="city" spellcheck="false"><button id="cityBtn" data-t="find"></button></div>
      <p class="live" id="live"></p>
    </div>
    <div class="chips" id="presets"></div>
    <div class="row"><span data-t="intensity"></span><output data-o="intensity"></output></div>
    <input type="range" min="0" max="100" data-k="intensity">
    <div class="row"><span data-t="wind"></span><output data-o="wind"></output></div>
    <input type="range" min="-100" max="100" data-k="wind" class="bi">
    <div class="row"><span data-t="size"></span><output data-o="size"></output></div>
    <input type="range" min="0" max="100" data-k="size">
    <label class="tg"><span><span data-t="gusts"></span><small data-t="gustsD"></small></span><span class="sw"><input type="checkbox" data-k="gusts"><i></i></span></label>
  </section>

  <section class="card">
    <h2>☃ <span data-t="piles"></span></h2>
    <label class="tg"><span><span data-t="ground"></span><small data-t="groundD"></small></span><span class="sw"><input type="checkbox" data-k="ground"><i></i></span></label>
    <label class="tg"><span><span data-t="windows"></span><small data-t="windowsD"></small></span><span class="sw"><input type="checkbox" data-k="windows"><i></i></span></label>
    <label class="tg"><span><span data-t="icicles"></span><small data-t="iciclesD"></small></span><span class="sw"><input type="checkbox" data-k="icicles"><i></i></span></label>
    <label class="tg"><span><span data-t="melt"></span><small data-t="meltD"></small></span><span class="sw"><input type="checkbox" data-k="melt"><i></i></span></label>
    <div class="row"><span data-t="opacity"></span><output data-o="opacity"></output></div>
    <input type="range" min="20" max="100" data-k="opacity">
  </section>

  <section class="card">
    <h2>✦ <span data-t="newYear"></span></h2>
    <label class="tg"><span><span data-t="garland"></span><small data-t="garlandD"></small></span><span class="sw"><input type="checkbox" data-k="garland"><i></i></span></label>
    <label class="tg"><span><span data-t="sleigh"></span><small data-t="sleighD"></small></span><span class="sw"><input type="checkbox" data-k="sleigh"><i></i></span></label>
    <label class="tg"><span><span data-t="excavator"></span><small data-t="excavatorD"></small></span><span class="sw"><input type="checkbox" data-k="excavator"><i></i></span></label>
    <label class="tg"><span><span data-t="snowman"></span><small data-t="snowmanD"></small></span><span class="sw"><input type="checkbox" data-k="snowman"><i></i></span></label>
    <div class="acts">
      <button data-cmd="snowman"><span>☃</span><b data-t="actSnowman"></b></button>
      <button data-cmd="sleigh"><span>🛷</span><b data-t="actSleigh"></b></button>
      <button data-cmd="excavator"><span>🚜</span><b data-t="actExcavator"></b></button>
      <button data-cmd="clear"><span>✧</span><b data-t="actClear"></b></button>
    </div>
  </section>

  <section class="card">
    <h2>⚙ <span data-t="general"></span></h2>
    <div class="row"><span data-t="language"></span></div>
    <div class="seg" id="langs"><button data-lang="auto" data-t="auto"></button><button data-lang="uz">O'zbekcha</button><button data-lang="en">English</button><button data-lang="ru">Русский</button></div>
    <label class="tg"><span><span data-t="launch"></span></span><span class="sw"><input type="checkbox" data-k="launchAtLogin"><i></i></span></label>
    <label class="tg"><span><span data-t="hideCapture"></span></span><span class="sw"><input type="checkbox" data-k="hideInCapture"><i></i></span></label>
  </section>
  <p class="tip" data-t="tip"></p>
</main>

<script>
const api = window.oppoq;
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
if (navigator.userAgent.includes('Mac')) document.body.classList.add('mac');

// decorative snow on the hero card
for (let i = 0; i < 22; i++) {
  const f = document.createElement('i'); f.className = 'flake';
  const s = 2 + Math.random() * 3;
  Object.assign(f.style, { left: Math.random() * 100 + '%', width: s + 'px', height: s + 'px', animationDuration: 3 + Math.random() * 4 + 's', animationDelay: -Math.random() * 6 + 's' });
  f.style.setProperty('--dx', (Math.random() * 30 - 10) + 'px');
  $('.hero').prepend(f);
}

let t = {};
const fmt = {
  intensity: v => v + '%',
  wind: v => v === 0 ? t.none : v < 0 ? '← ' + -v : v + ' →',
  size: v => t.sizes[v < 34 ? 0 : v < 67 ? 1 : 2],
  opacity: v => v + '%',
};
function paint(el) { if (el.type === 'range' && !el.classList.contains('bi')) el.style.setProperty('--p', (el.value - el.min) / (el.max - el.min) * 100 + '%'); }
function countdown(lang) {
  const now = new Date(), n = Math.ceil((new Date(now.getFullYear() + 1, 0, 1) - now) / 864e5);
  if (now.getMonth() === 0 && now.getDate() <= 7) return '· ' + t.happy;
  const d = t.days[new Intl.PluralRules(lang).select(n)] || t.days.other;
  return '· ' + t.until.replace('{n}', n).replace('{d}', d);
}

function render({ settings: S, live, presets: P, t: T, lang, ax }) {
  t = T;
  document.documentElement.lang = lang;
  document.title = t.app;
  $$('[data-t]').forEach(el => el.textContent = t[el.dataset.t]);
  $('#city').placeholder = t.cityPh;
  $('#countdown').textContent = countdown(lang);
  $$('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === (S.lang || 'auto')));
  const real = S.weatherMode === 'real';
  $('#run').checked = !S.paused;
  $('#ax').hidden = !(ax?.need && !S.axNo); // macOS: ask for the Accessibility permission (exact Dock size)
  $('#heroTitle').textContent = S.paused ? t.heroOff : t.heroOn;
  $('#heroSub').textContent = S.paused ? t.subOff : t.subOn;
  $$('[data-mode]').forEach(b => b.classList.toggle('on', b.dataset.mode === S.weatherMode));
  $('#realBox').hidden = !real;
  $('#presets').hidden = real;
  $('#presets').innerHTML = '';
  for (const p of P) {
    const b = document.createElement('button'); b.textContent = t['p_' + p.id];
    b.classList.toggle('on', Object.entries(p.v).every(([k, v]) => S[k] === v));
    b.onclick = () => api.send('set', { ...p.v });
    $('#presets').append(b);
  }
  const eff = { ...S };
  if (real && live?.intensity != null) { eff.intensity = live.intensity; eff.wind = live.wind; }
  $$('[data-k]').forEach(el => {
    const v = eff[el.dataset.k];
    if (el.type === 'checkbox') el.checked = v; else if (document.activeElement !== el) el.value = v;
    el.disabled = real && (el.dataset.k === 'intensity' || el.dataset.k === 'wind');
    paint(el);
  });
  $$('[data-o]').forEach(o => o.textContent = fmt[o.dataset.o](eff[o.dataset.o]));
  if (document.activeElement !== $('#city')) $('#city').value = S.city;
  const L = $('#live');
  L.classList.toggle('err', !!live?.error);
  L.innerHTML = !S.city ? t.enterCity
    : !live || live.loading ? t.loading
    : live.error ? t[live.error]
    : `<b>${esc(live.place)}</b> · ${live.temp}°C · ${t.codes[live.desc]} · ${t.windSpeed.replace('{n}', live.speed)}` +
      (live.snowing ? '' : '<br>' + t.notSnowing);
}
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

document.addEventListener('input', e => {
  const k = e.target.dataset.k; if (!k) return;
  paint(e.target);
  api.send('set', { [k]: e.target.type === 'checkbox' ? e.target.checked : Number(e.target.value) });
});
$('#run').onchange = e => api.send('set', { paused: !e.target.checked });
$$('[data-mode]').forEach(b => b.onclick = () => api.send('set', { weatherMode: b.dataset.mode }));
$$('[data-lang]').forEach(b => b.onclick = () => api.send('set', { lang: b.dataset.lang }));
$$('[data-cmd]').forEach(b => b.onclick = () => api.send('cmd', b.dataset.cmd));
const findCity = () => api.send('set', { city: $('#city').value.trim() });
$('#cityBtn').onclick = findCity;
$('#axYes').onclick = () => api.send('ax', true);
$('#axNo').onclick = () => api.send('ax', false);
$('#city').onkeydown = e => { if (e.key === 'Enter') { findCity(); e.target.blur(); } };

api.on('state', render);
api.get().then(render);
</script>
</body>
</html>
